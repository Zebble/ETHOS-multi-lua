name: Sync protocols from upstream

# Polls the DIY-Multiprotocol-TX-Module firmware for new protocols and adds any
# that are missing from main.lua. GitHub does not allow real-time triggers from a
# repo you don't own, so this runs on a daily schedule (and can be run on demand).

on:
  schedule:
    - cron: "17 6 * * *"   # daily at 06:17 UTC
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write
  actions: write   # keepalive: re-enable call below

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # GitHub disables scheduled workflows after 60 days with no repo activity;
      # calling the enable endpoint on each run resets that timer (no dummy commits).
      - name: Keepalive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sync-upstream.yml/enable"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Sync protocols
        run: python tools/sync_protocols.py

      # Fail the run before committing if an auto-added line broke Lua syntax.
      - name: Lua syntax check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          luac5.4 -p main.lua

      - name: Commit changes if any
        run: |
          if git diff --quiet -- main.lua; then
            echo "main.lua already up to date — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.lua
          git commit -m "chore: sync new multiprotocol(s) from upstream firmware"
          git push
